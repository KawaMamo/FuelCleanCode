spring:
  datasource:
    #SERVER-DEPLOY#url: jdbc:mysql://mysqldb:3306/usersdb
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
      format_sql: true;
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  application:
    name: identity-provider

  profiles:
        active: docker


server:
  port: 9090

  error:
    include-message: ALWAYS
    include-binding-errors: ALWAYS

super:
  admin:
    username: admin
    password: password

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs




