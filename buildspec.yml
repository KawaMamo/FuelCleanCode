version: 0.2
env:
  variables:
    ECR_REPO_NAME: fuel
phases:
  install:
    commands:
      - echo "Installing dependencies"
      - mvn install -DskipTests

  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=${AWS_DEFAULT_REGION}
      - ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=latest
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION |
        docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo Building Docker images...
      - docker-compose build
  post_build:
    commands:
      - echo Pushing Docker images...
      - docker-compose push
      - echo Writing image definitions file...
      - printf '[{"name":"core-service","imageUri":"%s"},{"name":"identity-provider","imageUri":"%s"}]' \
        $ECR_REGISTRY/fuel/core-service:latest \
        $ECR_REGISTRY/fuel/identity-provider:latest \
        > imagedefinitions.json

artifacts:
  files:
    - '**/*'
    - imagedefinitions.json